<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediAssist — Reset Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<button class="theme-toggle-fixed" onclick="toggleTheme()" title="Toggle theme">
  <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/>
        </svg>
      </div>
      <div class="auth-logo-text">MediAssist</div>
    </div>

    <h1 class="auth-heading">Create new password</h1>
    <p class="auth-subheading">Choose a strong, secure password</p>

    {% if error %}
    <div class="error-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST">
      <div class="field-group">
        <label class="field-label" for="password">New Password</label>
        <input type="password" id="password" name="password" class="field-input" placeholder="Enter new password" autocomplete="new-password" required oninput="checkStrength(this.value); checkMatch()" />
      </div>

      <div class="strength-row">
        <div class="strength-bars">
          <div class="strength-bar-bg"><div class="strength-bar-fill" id="bar1"></div></div>
          <div class="strength-bar-bg"><div class="strength-bar-fill" id="bar2"></div></div>
          <div class="strength-bar-bg"><div class="strength-bar-fill" id="bar3"></div></div>
          <div class="strength-bar-bg"><div class="strength-bar-fill" id="bar4"></div></div>
        </div>
        <div class="strength-label" id="strengthLabel">—</div>
      </div>

      <div class="field-group">
        <label class="field-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="field-input" placeholder="Confirm new password" autocomplete="new-password" required oninput="checkMatch()" />
        <div class="match-hint" id="matchHint">
          <span id="matchText">Passwords match</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 8px;">Reset Password</button>
    </form>

    <div class="auth-footer">
      Remember it now? <a href="/login">Back to Sign In</a>
    </div>

    <p class="auth-meta">
      All data transfers are TLS-encrypted.<br>
      Minimum 8 characters recommended.
    </p>
  </div>
</div>

<script>
  /* Theme Toggle */
  function setThemeIcon(isLight) {
    const i = document.getElementById('theme-icon');
    if (!i) return;
    i.innerHTML = isLight
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  }
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    setThemeIcon(isLight);
  }
  (function () {
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    setThemeIcon(document.body.classList.contains('light'));
  })();

  /* Password Strength Meter */
  function checkStrength(val) {
    let score = 0;
    if (val.length >= 8)  score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/\d/.test(val))   score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
    const labels = ['Weak', 'Fair', 'Good', 'Strong'];
    const label  = document.getElementById('strengthLabel');

    for (let i = 1; i <= 4; i++) {
      const fill = document.getElementById('bar' + i);
      if (val.length === 0) {
        fill.style.width = '0%';
        label.textContent = '—';
        label.style.color = 'var(--text-muted)';
      } else if (i <= score) {
        fill.style.width = '100%';
        fill.style.backgroundColor = colors[score - 1];
        label.textContent = labels[score - 1];
        label.style.color = colors[score - 1];
      } else {
        fill.style.width = '0%';
      }
    }
  }

  /* Confirm Password Match */
  function checkMatch() {
    const pw  = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;
    const hint = document.getElementById('matchHint');
    const text = document.getElementById('matchText');

    if (cpw.length === 0) {
      hint.classList.remove('visible', 'ok', 'bad');
      return;
    }

    hint.classList.add('visible');
    if (pw === cpw) {
      hint.classList.add('ok');
      hint.classList.remove('bad');
      text.textContent = 'Passwords match';
    } else {
      hint.classList.add('bad');
      hint.classList.remove('ok');
      text.textContent = 'Passwords do not match';
    }
  }
</script>

</body>
</html>
