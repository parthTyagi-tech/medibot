<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediAssist — Create Account</title>
  <meta name="description" content="Create your MediAssist account to access personalized AI medical guidance." />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<button class="theme-toggle-fixed" onclick="toggleTheme()" title="Toggle theme">
  <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/>
        </svg>
      </div>
      <div class="auth-logo-text">MediAssist</div>
    </div>

    <h1 class="auth-heading">Sign up to MediAssist</h1>
    <p class="auth-subheading">Create your account to start consultations</p>

    <!-- Google OAuth -->
    <a href="/login/google" class="btn-google" id="google-signup-btn">
      <svg viewBox="0 0 48 48" width="18" height="18">
        <path fill="#EA4335" d="M24 9.5c3.1 0 5.6 1.1 7.7 2.8l5.7-5.7C33.8 3.5 29.2 1.5 24 1.5 14.9 1.5 7.2 7 3.7 14.8l6.6 5.1C12 13.5 17.5 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-16.9z"/>
        <path fill="#FBBC05" d="M10.3 28.9A14.6 14.6 0 0 1 9.5 24c0-1.7.3-3.3.8-4.9l-6.6-5.1A22.4 22.4 0 0 0 1.5 24c0 3.6.9 7 2.2 10l6.6-5.1z"/>
        <path fill="#34A853" d="M24 46.5c5.2 0 9.6-1.7 12.8-4.6l-7.4-5.7c-1.8 1.2-4.1 1.9-5.4 1.9-6.5 0-12-4-13.7-9.3l-6.6 5.1C7.2 41 14.9 46.5 24 46.5z"/>
      </svg>
      <span>Continue with Google</span>
    </a>

    <div class="auth-divider"><span>or</span></div>

    <form action="/signup" method="POST" id="signup-form">
      {% if error %}
      <div class="error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="field-group">
        <label class="field-label" for="name">Name</label>
        <input type="text" name="name" id="name" class="field-input" placeholder="Enter Your Full Name" required autocomplete="name" />
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input type="email" name="email" id="email" class="field-input" placeholder="Enter Your Email" required autocomplete="email" />
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="field-input" placeholder="Enter Your Password" required autocomplete="new-password" />
      </div>

      <div class="field-group">
        <label class="field-label" for="confirm_password">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" class="field-input" placeholder="Confirm Your Password" required autocomplete="new-password" />
      </div>

      <button type="submit" class="btn-primary" id="submit-btn" style="margin-top: 8px;">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>

    <p class="auth-meta">
      Your data is encrypted and private.<br>
      MediAssist is for informational purposes only.
    </p>
  </div>
</div>

<script>
  function setThemeIcon(isLight) {
    const i = document.getElementById('theme-icon');
    if (!i) return;
    i.innerHTML = isLight
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  }
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    setThemeIcon(isLight);
  }
  (function () {
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    setThemeIcon(document.body.classList.contains('light'));
  })();
</script>

</body>
</html>
