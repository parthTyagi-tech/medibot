<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediAssist — Forgot Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<button class="theme-toggle-fixed" onclick="toggleTheme()" title="Toggle theme">
  <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/>
        </svg>
      </div>
      <div class="auth-logo-text">MediAssist</div>
    </div>

    <h1 class="auth-heading">Reset your password</h1>
    <p class="auth-subheading">Enter your email to receive a verification code</p>

    <form action="/forgot-password" method="POST" id="forgot-form">
      {% if error %}
      <div class="error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      {% if success %}
      <div class="success-box">{{ success }}</div>
      {% endif %}

      <div class="field-group">
        <label class="field-label" for="email">Email address</label>
        <input type="email" name="email" id="email" class="field-input" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 8px;">Send Verification Code</button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="/login">Back to Sign In</a>
    </div>

    <p class="auth-meta">
      A 6-digit code will be sent to your email.<br>
      Check your spam folder if you don't see it.
    </p>
  </div>
</div>

<script>
  function setThemeIcon(isLight) {
    const i = document.getElementById('theme-icon');
    if (!i) return;
    i.innerHTML = isLight
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  }
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    setThemeIcon(isLight);
  }
  (function () {
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    setThemeIcon(document.body.classList.contains('light'));
  })();
</script>

</body>
</html>
