# CodeRabbit Configuration File
# https://docs.coderabbit.ai/guides/configure-coderabbit

version: "2"
language: "en-US"
tone_instructions: "Be concise, analytical, and prioritize clinical safety, docstring coverage, and test integrity."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "Draft"
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "dev"

  tools:
    ast-grep:
      enabled: true
    ruff:
      enabled: true
    shellcheck:
      enabled: true

  pre_merge_checks:
    docstrings:
      enabled: true
      threshold: 85
    title:
      enabled: true
    description:
      enabled: true
    linked_issues:
      enabled: false
    out_of_scope_changes:
      enabled: true

  path_filters:
    - "!**/*.db"
    - "!**/*.sqlite"
    - "!**/*.sqlite3"
    - "!**/*.pyc"
    - "!**/__pycache__/**"
    - "!**/.fastembed_cache/**"
    - "!static/audio/**"
    - "!instance/**"

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    enabled: true
